[package]
name = "linear-caryotype"
version = "0.1.0"
description = "Linear Caryotype: always-on-top day runner for Linear backlogs."
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "linear_caryotype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lrctserver"
path = "src/bin/lrctserver.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
plist = "1"
notify = "6"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = "3"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Platform-specific
[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26"
objc = "0.2"

[features]
# By default Tauri uses Vite's HMR; no extra cargo features needed.
default = []
